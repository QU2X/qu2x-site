<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: rgba(255,255,255,.62);
    --w: min(86vw,880px);
  }

  * {
    box-sizing: border-box;
    margin: 0;
  }

  html,
  body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Orbitron', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
    text-align: center;
    overflow-x: hidden;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  #logo {
    width: var(--w);
    height: auto;
    display: block;
  }

  h1 {
    font-weight: 400;
    font-size: calc(var(--w) * .036);
    letter-spacing: .5em;
    margin: calc(var(--w) * .075) 0 0 .5em;
    white-space: nowrap;
  }

  footer {
    margin-top: clamp(20px,5vh,56px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding-bottom: 12px;
  }

  .mail {
    font-family: 'Barlow', sans-serif;
    font-weight: 500;
    font-size: calc(var(--w) * .037);
    letter-spacing: .22em;
    margin-right: -.22em;
    cursor: text;
    -webkit-user-select: all;
    user-select: all;
  }

  hr {
    width: 40px;
    border: 0;
    border-top: 1px solid var(--dim);
  }

  small {
    font-family: 'Barlow', sans-serif;
    font-weight: 500;
    font-size: clamp(8px,.6vw,10px);
    letter-spacing: .24em;
    color: var(--dim);
    text-transform: uppercase;
  }
</style>
</head>
